<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
</head>

<body>
<div id="pokemon-filters">
    <h4>Filtrer pokémon</h4>
    <select id="pokemon-type">
    <option value="%">ALL</option>
    <option value="Fire">FIRE</option>
    <option value="Water">WATER</option>
    <option value="Bug">BUG</option>
    <option value="Normal">NORMAL</option>
    <option value="Poison">POISON</option>
    <option value="Electric">ELECTRIC</option>
    <option value="Fairy">FAIRY</option>
    <option value="Fighting">FIGHTING</option>
    <option value="Ground">GROUND</option>
    <option value="Psychic">PSYCHIC</option>
    <option value="Rock">ROCK</option>
    <option value="Ghost">GHOST</option>
    <option value="Ice">ICE</option>
    <option value="Dragon">DRAGON</option>
    <option value="Grass">GRASS</option>
    </select>

    <input type="number" id="minAttack" placeholder="Minimum attack">
    <input type="text" id="pokemonName" placeholder="Search Pokémon">
    <input type="number" id="minHp" placeholder="Minimum HP">

    <select id="sortAttack">
        <option value="ASC">Lowest attack</option>
        <option value="DESC">Highest attack</option>
    </select>
</div>

<ul id="pokemonListe">

</ul>
<p>ALL POKEMON WITH THEIR BODYTYPES</p>
<div id="bodyTypesList"></div>
<script src="pokemon.js"></script>
</body>
</html>
